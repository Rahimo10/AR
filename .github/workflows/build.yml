name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # يسمح لك بتشغيل البناء يدوياً من زر في الموقع

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true
      
      - name: 📦 Install dependencies
        run: flutter pub get
      
      - name: 🔑 Setup .env file from Secrets
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "SERPAPI_KEY=${{ secrets.SERPAPI_KEY }}" >> .env
      
      - name: 🏗️ Build APK (Release)
        run: flutter build apk --release --split-per-abi
      
      - name: 📤 Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: formation-dz-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: formation-dz-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
